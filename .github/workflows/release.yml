name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run security and audit regression tests
        run: |
          python tests/test_audit_fixes.py

      - name: Build standalone executables
        run: |
          python build_exe.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $file = Get-Item "dist_installer\SmartCatalog-Setup-*.exe"
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          Set-Content -Path "$($file.FullName).sha256" -Value "$hash  $($file.Name)"
          Write-Host "SHA-256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/SmartCatalog-Setup-*.exe
            dist_installer/SmartCatalog-Setup-*.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
